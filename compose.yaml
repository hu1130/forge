services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: forge
      MYSQL_USER: forge_migrator
      MYSQL_PASSWORD: forge_dev_only
      MYSQL_ROOT_PASSWORD: forge_root_dev_only
    ports:
      - "127.0.0.1:33069:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - forge-mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  forge-mysql-data:
