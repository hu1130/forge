services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - forge-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  postgres-role:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: forge_dev_only
    volumes:
      - ./infra/postgres/init:/bootstrap:ro
    command: ["psql", "-h", "postgres", "-U", "forge", "-d", "forge", "-f", "/bootstrap/001_app_role.sql"]
    restart: "no"

volumes:
  forge-postgres-data:
